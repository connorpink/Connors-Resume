name: Build and Release Resume

permissions:
  contents: write

on:
  push:
    paths:
      - "main.tex"
    branches:
      - main
  workflow_dispatch: # Backup manual trigger
    inputs:
      publish_track:
        description: "How this build should be published"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - general
          - job-specific
      job_description:
        description: 'Job/Company name for this resume version (e.g., "Google SWE" or "Meta Research")'
        required: false
        default: ""
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract job from commit message
        id: extract_job
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "job_name=${{ inputs.job_description }}" >> $GITHUB_OUTPUT
            echo "publish_track=${{ inputs.publish_track }}" >> $GITHUB_OUTPUT
            echo "publish_track=${{ inputs.publish_track }}" >> $GITHUB_OUTPUT
          else
            # Extract [job: XYZ] from commit message
            COMMIT_MSG="${{ github.event.head_commit.message }}"
            JOB_NAME=$(echo "$COMMIT_MSG" | grep -oP '\[job:\s*\K[^\]]+' || echo "")
            echo "job_name=$JOB_NAME" >> $GITHUB_OUTPUT
            echo "publish_track=auto" >> $GITHUB_OUTPUT
            echo "publish_track=auto" >> $GITHUB_OUTPUT
          fi

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra

      - name: Compile LaTeX
        run: |
          pdflatex -jobname=resume main.tex
          pdflatex -jobname=resume main.tex

      - name: Install ImageMagick
        run: |
          sudo apt-get install -y imagemagick ghostscript
          sudo sed -i 's/rights="none" pattern="PDF"/rights="read|write" pattern="PDF"/' /etc/ImageMagick-6/policy.xml

      - name: Generate preview image
        run: |
          convert -density 300 resume.pdf[0] -quality 90 preview.jpg

      - name: Get timestamp
        id: timestamp
        run: echo "timestamp=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Prepare release info
        id: release_info
        run: |
          JOB_NAME="${{ steps.extract_job.outputs.job_name }}"
          PUBLISH_TRACK="${{ steps.extract_job.outputs.publish_track }}"
          TIMESTAMP="${{ steps.timestamp.outputs.timestamp }}"

          if [ "$PUBLISH_TRACK" = "general" ]; then
            RELEASE_KIND="general"
          elif [ "$PUBLISH_TRACK" = "job-specific" ]; then
            RELEASE_KIND="job-specific"
          elif [ -n "$JOB_NAME" ]; then
            RELEASE_KIND="job-specific"
          else
            RELEASE_KIND="general"
          fi

          if [ "$RELEASE_KIND" = "job-specific" ]; then
            if [ -z "$JOB_NAME" ]; then
              echo "A job-specific release requires a job description." >&2
              exit 1
            fi

            SAFE_JOB_NAME=$(printf '%s' "$JOB_NAME" | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+//; s/-+$//')
            echo "archive_tag=${SAFE_JOB_NAME}-${TIMESTAMP}" >> $GITHUB_OUTPUT
            echo "archive_release_name=Resume - $JOB_NAME ($TIMESTAMP)" >> $GITHUB_OUTPUT
            echo "release_kind=job-specific" >> $GITHUB_OUTPUT
            echo "has_job=true" >> $GITHUB_OUTPUT
            echo "job_name=$JOB_NAME" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "archive_tag=general-${TIMESTAMP}" >> $GITHUB_OUTPUT
            echo "archive_release_name=Resume - General ($TIMESTAMP)" >> $GITHUB_OUTPUT
            echo "release_kind=general" >> $GITHUB_OUTPUT
            echo "has_job=false" >> $GITHUB_OUTPUT
            echo "job_name=" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add resume.pdf preview.jpg
          git diff --staged --quiet || git commit -m "🤖 Auto-build: Update PDF and preview [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create archive release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.release_info.outputs.archive_tag }}
          name: ${{ steps.release_info.outputs.archive_release_name }}
          body: |
            📄 **${{ steps.release_info.outputs.has_job == 'true' && format('Resume for: {0}', steps.release_info.outputs.job_name) || 'Automated Resume Build' }}**

            Built from commit: ${{ github.sha }}

            This release contains the ${{ steps.release_info.outputs.has_job == 'true' && 'tailored resume PDF for this specific position' || 'compiled general resume PDF for archival purposes' }}.
          files: |
            resume.pdf
            preview.jpg
          draft: false
          prerelease: ${{ steps.release_info.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update stable general tags
        if: steps.release_info.outputs.release_kind == 'general'
        run: |
          git tag -f general "${GITHUB_SHA}"
          git tag -f latest "${GITHUB_SHA}"
          git push origin refs/tags/general --force
          git push origin refs/tags/latest --force

      - name: Publish general release alias
        if: steps.release_info.outputs.release_kind == 'general'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: general
          name: Resume - General
          body: |
            📄 **General resume**

            Stable release for the latest general-purpose version of this resume.

            Built from commit: ${{ github.sha }}
          files: |
            resume.pdf
            preview.jpg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish latest release alias
        if: steps.release_info.outputs.release_kind == 'general'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Resume - Latest General
          body: |
            📄 **Latest general resume**

            Moving release alias for external links that should always resolve to the newest general resume.

            Built from commit: ${{ github.sha }}
          files: |
            resume.pdf
            preview.jpg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
